[project]
name = "mcdm-landfill-pareto"
version = "1.8.0"
description = "Replication package: Normalisation as implicit re-weighting in MCDM portfolio selection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
geo = [
    "geopandas>=0.13",
    "shapely>=2.0",
    "rasterio>=1.3",
]

[tool.uv]
dev-dependencies = []
